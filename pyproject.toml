[project]
name = "dhlab-app-whisper"
version = "0.1.0"
description = "Transcribe Norwegian speech with NB-Whisper in a Gradio app"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gradio~=5.45",
    "transformers>=4.44",
    "torch>=2.4",
    "librosa>=0.10",
]

[tool.pdm]
distribution = false

[[tool.pdm.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
include_packages = ["torch"]

[tool.pdm.scripts]
local = "python app.py"
serve = "python -m http.server 8000 --directory docs"
vendor-lite = "python scripts/vendor_gradio_lite.py"

[dependency-groups]
test = [
    "playwright>=1.64.1",
]
tools = [
    "packaging>=26.3",
]
